name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            git diffutils bats parallel shellcheck nodejs lua stow zsh python ruff \
            pacman-contrib qt6-declarative qt6-shadertools
          useradd -m tester

      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          # As an ordinary user, like on the desktop
          chown -R tester: .
          runuser -u tester -- env HOME=/home/tester tests/run
