# The look shared by the desktop's programs. apply-ui renders it into the
# files under templates/ (Hyprland, hyprlock, hyprtoolkit, slurp, yazi, btop,
# lazygit) and hands all of it to the shell as quickshell/ui.js. What only
# the shell uses (its sizes, timings and font sizes) lives in
# quickshell/Theme.qml.

[rounding]
window = 8
power = 2.0

[border]
size = 2

[spacing]
gaps_in = 10
gaps_out = 20

[opacity]
active = 1.0
inactive = 0.96
dim_special = 0.20

# The blurred desktop behind the lock screen (hyprlock).
[lock]
brightness = 0.55
vibrancy = 0.2

[font]
family = "JetBrainsMono Nerd Font Propo"
mono = "JetBrainsMono Nerd Font Mono"
ui = "Adwaita Sans 12"
size_cursor = 24

[theme]
cursor = "Bibata-Modern-Classic"
icon = "Papirus-Dark"
gtk = "Adwaita-dark"

[colors]
bg_main = "#0d1117"
bg_card = "#161b22"
bg_hover = "#21262d"
border = "#30363d"
accent_blue = "#58a6ff"
accent_purple = "#bc8cff"
accent_green = "#3fb950"
warning = "#d29922"
critical = "#f85149"
text_main = "#c9d1d9"
text_dim = "#8b949e"
text_muted = "#484f58"
shadow = "#010409"
