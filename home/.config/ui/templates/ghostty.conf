# Ghostty in the desktop's colours, over its GitHub Dark theme (arch.conf reads it): the
# cursor in the accent, the palette's colours that ui.toml has.
cursor-color = @accent_blue@
cursor-text = @bg_main@
background = @bg_main@
palette = 0=@text_muted@
palette = 1=@critical@
palette = 2=@accent_green@
palette = 3=@warning@
palette = 4=@accent_blue@
palette = 5=@accent_purple@
