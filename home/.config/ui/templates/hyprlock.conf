# The stand-in lock screen. quickshell locks the session; quickshell-session
# runs hyprlock only when that shell cannot start, so that autologin never
# leaves an open desktop behind. Laid out like the quickshell lock screen:
# clock, date and a password field over the blurred desktop.

general {
    hide_cursor = true
}

auth {
    fingerprint {
        enabled = true
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 1.5, linear
    animation = fadeOut, 1, 1, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgb(@bg_main:bare@)
    blur_size = 10
    blur_passes = 3
    noise = 0.02
    contrast = 1.0
    brightness = @lock_brightness@
    vibrancy = @lock_vibrancy@
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = @border_size@
    inner_color = rgba(@bg_card:bare@a6)

    outer_color = rgba(@accent_blue:bare@ee) rgba(@accent_purple:bare@ee) 45deg
    check_color = rgba(@accent_green:bare@ee) rgba(@accent_blue:bare@ee) 120deg
    fail_color = rgba(@warning:bare@ee) rgba(@critical:bare@ee) 40deg

    font_color = rgb(@text_main:bare@)
    fade_on_empty = false
    rounding = @rounding@

    font_family = @font@
    placeholder_text =
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"<span font_weight='700'>%H:%M</span>"
    color = rgb(@text_main:bare@)
    font_size = 96
    font_family = @font@
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(@text_main:bare@)
    font_size = 18
    font_family = @font@
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = The shell did not start: after unlocking only the key binds work.
    color = rgb(@text_dim:bare@)
    font_size = 12
    font_family = @font@
    position = 0, 40
    halign = center
    valign = bottom
}
