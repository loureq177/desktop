# The lock screen: clock, date and a password field over the blurred desktop.
# hypridle starts it; at login hyprland/autostart.lua does, with hyprlock-boot.conf.

general {
    hide_cursor = true
}

auth {
    # Not shown: the fingerprint under the field tells the two apart.
    fingerprint {
        enabled = true
        ready_message = listening
        present_message = reading
    }
}

animations {
    bezier = linear, 1, 1, 0, 0
    bezier = easeInOutSine, 0.37, 0, 0.63, 1
    animation = fadeIn, 1, 4.5, easeInOutSine
    animation = fadeOut, 1, 3, easeInOutSine
    animation = inputFieldDots, 1, 2, linear
}

# How the desktop is blurred; hyprlock-boot.conf blurs the wallpaper the same way.
$blur_size = 10
$blur_passes = 3
$blur_noise = 0.02
$blur_contrast = 1.0
$blur_brightness = @lock_brightness@
$blur_vibrancy = @lock_vibrancy@

# The bar text's soft glow (Halo.qml) for text on the desktop; one pass, no boost.
$shadow_passes = 1
$shadow_size = 4
$shadow_boost = 1.0
$shadow_color = rgba(0, 0, 0, 0.4)

background {
    path = screenshot
    color = rgb(@bg_main:bare@)
    blur_size = $blur_size
    blur_passes = $blur_passes
    noise = $blur_noise
    contrast = $blur_contrast
    brightness = $blur_brightness
    vibrancy = $blur_vibrancy
    # Below the wallpaper of hyprlock-boot.conf.
    zindex = -2
}

input-field {
    # Pixels, like the fonts and positions: a share of the screen grows the
    # field on a bigger monitor while the text around it stays put.
    size = 384, 54
    outline_thickness = @border_size@
    inner_color = rgba(@bg_card:bare@a6)

    outer_color = rgba(@accent_blue:bare@ff) rgba(@accent_purple:bare@ff) 0deg
    check_color = rgba(@accent_green:bare@ff) rgba(@accent_blue:bare@ff) 0deg
    fail_color = rgba(@warning:bare@ff) rgba(@critical:bare@ff) 0deg

    font_color = rgb(@text_main:bare@)
    fade_on_empty = false
    rounding = @rounding_window@

    font_family = @font_family@
    placeholder_text =
    fail_text = $FAIL
    dots_spacing = 0.3

    position = 0, -50
}

# The reader, without words: a fingerprint breathing in the accent while it listens, steady
# while a finger is on it, none when hyprlock could not claim it (as right after a suspend).
label {
    # One frame each 0.1 s, a 2.4 s breath; hyprlock reruns it at once when the reader changes.
    # Never empty: a label with no text can stop updating.
    text = cmd[update:100] case "$FPRINTFAIL$FPRINTPROMPT" in ""|*disconnected*|*disabled*) echo " " ;; *reading) echo "󰈷" ;; *) a=(30 31 35 40 48 56 65 74 82 90 95 99 100 99 95 90 83 74 65 56 48 40 35 31); echo "<span fgalpha='${a[${EPOCHREALTIME/./} / 100000 % 24]}%'>󰈷</span>" ;; esac
    color = rgb(@accent_blue:bare@)
    font_size = 26
    font_family = @font_family@
    position = 0, -112
    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_boost = $shadow_boost
    shadow_color = $shadow_color
}

label {
    text = <span font_weight='700'>$TIME</span>
    color = rgb(@text_main:bare@)
    font_size = 96
    font_family = @font_family@
    position = 0, 160
    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_boost = $shadow_boost
    shadow_color = $shadow_color
}

label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(@text_main:bare@)
    font_size = 18
    font_family = @font_family@
    position = 0, 80
    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_boost = $shadow_boost
    shadow_color = $shadow_color
}
