# The lock at login (hyprland/autostart.lua): there is no desktop to blur yet, so the
# wallpaper ~/.local/bin/wallpaper picked stands in for the screenshot.

source = ./hyprlock.conf

# The password only: this unlock is what unlocks the login keyring (the
# hyprlock PAM file), and a fingerprint gives it nothing to unlock it with.
auth {
    fingerprint {
        enabled = false
    }
}

background {
    reload_cmd = cat ~/.cache/wallpaper/current
    color = rgb(@bg_main:bare@)
    blur_size = $blur_size
    blur_passes = $blur_passes
    noise = $blur_noise
    contrast = $blur_contrast
    brightness = $blur_brightness
    vibrancy = $blur_vibrancy
}

# Says why the reader is not listening here.
label {
    text = First login requires a password
    color = rgb(@text_dim:bare@)
    font_size = 13
    font_family = @font_family@
    position = 0, -105
    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_color = $shadow_color
}
