# The lock at login (hyprland.lua): there is no desktop to blur yet, so the
# wallpaper ~/.local/bin/wallpaper picked stands in for the screenshot.

source = ./hyprlock.conf

background {
    monitor =
    reload_cmd = cat ~/.cache/wallpaper/current
    color = rgb(@bg_main:bare@)
    blur_size = $blur_size
    blur_passes = $blur_passes
    noise = $blur_noise
    contrast = $blur_contrast
    brightness = $blur_brightness
    vibrancy = $blur_vibrancy
    vibrancy_darkness = 0.0
    zindex = -1
}
