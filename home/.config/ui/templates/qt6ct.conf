# Qt programs, through the qt6ct platform theme (QT_QPA_PLATFORMTHEME, hyprland/env.lua):
# Fusion in the desktop's palette (qt6ct-colors.conf), its icons and fonts, and the
# portal's file chooser, which apply-ui dresses for GTK (gtk.css).

[Appearance]
color_scheme_path=~/.config/qt6ct/colors/ui.conf
custom_palette=true
icon_theme=@theme_icon@
standard_dialogs=xdgdesktopportal
style=Fusion

[Fonts]
fixed="@font_mono@,12"
general="@font_ui_qt@"
