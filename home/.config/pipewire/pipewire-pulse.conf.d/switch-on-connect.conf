# A device that connects (Bluetooth headphones, a USB DAC) takes the sound;
# WirePlumber alone would keep whichever was picked more recently. Not HDMI, not
# a dock: its line-out and mic count as connected with nothing plugged into them.
pulse.cmd = [
  { cmd = "load-module" args = "module-switch-on-connect blocklist=hdmi|iec958|Dock" flags = [ nofail ] }
]
