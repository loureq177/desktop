[Service]
# Keep swaync on AMD iGPU: avoids GTK4/NVIDIA PRIME 100% CPU spin (swaync 0.12.x)
# and keeps NVIDIA dGPU suspended.
Environment=GSK_RENDERER=gl
Environment=GTK_DISABLE_VULKAN=1
Environment=LIBVA_DRIVER_NAME=radeonsi
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json:/usr/share/vulkan/icd.d/radeon_icd.i686.json
Environment=VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json:/usr/share/vulkan/icd.d/radeon_icd.i686.json
Environment=AQ_DRM_DEVICES=/dev/dri/amd-igpu:/dev/dri/nvidia-dgpu
