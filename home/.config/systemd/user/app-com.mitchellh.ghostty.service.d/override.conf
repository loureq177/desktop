[Unit]
PartOf=hyprland-session.target

[Service]
# Always up: a window takes 60 ms from it, against 900 from a new process.
ExecStart=
ExecStart=ghostty --gtk-single-instance=true --initial-window=false --quit-after-last-window-closed=false
# Ghostty installs its SIGUSR2 handler after READY=1, so notify-reload refuses startup
Type=notify
ExecReload=
ExecReload=/bin/kill -USR2 $MAINPID
