# Ly display manager configuration (minimal template).
# Upstream documents every key with comments; see ly upstream config.def.h / example config.ini.
# Only effective settings are tracked here — comments were stripped to keep the template small.
# Theme-synced keys (bg, border_fg, fg, error_fg, colormix_*, doom_*, cmatrix_*, gameoflife_fg,
# full_color, animation_frame_delay) are patched by apply-ui from ui.toml — edit ui.toml, not this file.

allow_empty_password = false
animation = colormix
animation_frame_delay = 5
animation_timeout_sec = 0
asterisk = 0x2022
auth_fails = 3
battery_id = BAT0
auto_login_service = ly-autologin
auto_login_session = null
auto_login_user = null
bg = 0x00000001
bigclock = none
bigclock_12hr = false
bigclock_seconds = false
blank_box = true
border_fg = 0x40000001
box_title = null
brightness_down_cmd = /usr/bin/brightnessctl -q -n s 10%-
brightness_down_key = F5
brightness_up_cmd = /usr/bin/brightnessctl -q -n s +10%
brightness_up_key = F6
clear_password = true
clock = null
cmatrix_fg = 0x00000005
cmatrix_head_col = 0x01000008
cmatrix_min_codepoint = 0x21
cmatrix_max_codepoint = 0x7B
colormix_col1 = 0x00000001
colormix_col2 = 0x40000005
colormix_col3 = 0x40000006
custom_bind_width = null
custom_sessions = /etc/ly/custom-sessions
default_input = login
doom_fire_height = 6
doom_fire_spread = 2
doom_top_color = 0x00000006
doom_middle_color = 0x40000005
doom_bottom_color = 0x00000008
dur_file_path = /etc/ly/example.dur
dur_offset_alignment = center
dur_x_offset = 0
dur_y_offset = 0
edge_margin = 0
error_bg = 0x00000000
error_fg = 0x41000002
fg = 0x00000008
full_color = false
gameoflife_entropy_interval = 10
gameoflife_fg = 0x00000005
gameoflife_frame_delay = 6
gameoflife_initial_density = 0.4
hibernate_cmd = null
hibernate_key = F4
hide_borders = false
hide_key_hints = false
hide_keyboard_locks = false
hide_version_string = false
inactivity_cmd = null
inactivity_delay = 0
initial_info_text = null
input_len = 34
lang = en
login_cmd = null
login_defs_path = /etc/login.defs
logout_cmd = null
ly_log = /var/log/ly.log
margin_box_h = 2
margin_box_v = 1
numlock = false
path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
restart_cmd = /sbin/shutdown -r now
restart_key = F2
save = true
service_name = ly
session_log = .local/state/ly-session.log
setup_cmd = /etc/ly/setup.sh
shell = true
show_password_key = F7
show_tty = false
shutdown_cmd = /sbin/shutdown -a now
shutdown_key = F1
sleep_cmd = null
sleep_key = F3
start_cmd = /etc/ly/startup.sh
text_in_center = false
vi_default_mode = normal
vi_mode = false
waylandsessions = /usr/share/wayland-sessions
x_cmd = /usr/bin/X
x_vt = null
xauth_cmd = /usr/bin/xauth
xinitrc = ~/.xinitrc
xsessions = /usr/share/xsessions
