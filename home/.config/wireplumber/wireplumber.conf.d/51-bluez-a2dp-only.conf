# A2DP/LE Audio only, no HFP/HSP (applies to every Bluetooth device).
# Headsets that open HFP first (Px8 S2) race the A2DP connect, bluez drops
# A2DP with EBUSY and the card is stuck on the call profile whose SCO acquire
# fails, so nothing plays until PipeWire restarts. The laptop mic is used for
# input anyway, so the headset mic is not needed.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source bap_bcast_sink bap_bcast_source ]
}
