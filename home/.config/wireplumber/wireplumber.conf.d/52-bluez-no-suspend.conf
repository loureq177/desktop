# Keep Bluetooth sinks open instead of suspending them after 5s of silence.
# Suspend releases the A2DP transport, and on Bowers & Wilkins headsets (Px8 S2)
# the next Acquire sometimes fails with org.bluez.Error.NotAuthorized: bluez
# still considers the transport busy, PipeWire gives up on it and nothing plays
# until PipeWire restarts. Costs some headset battery and keeps its auto-off
# from triggering while connected to the laptop.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# Log transport Acquire/Release so a recurrence shows what preceded it.
context.properties = {
  log.level = "W,spa.bluez5:I"
}
