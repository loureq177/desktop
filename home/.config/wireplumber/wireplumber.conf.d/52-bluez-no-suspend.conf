# Bluetooth sinks stay open: after a suspend the B&W Px8 S2's next Acquire can fail
# (NotAuthorized) until PipeWire restarts. Costs some headset battery.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# Log transport Acquire/Release so a recurrence shows what preceded it.
context.properties = {
  log.level = "W,spa.bluez5:I"
}
