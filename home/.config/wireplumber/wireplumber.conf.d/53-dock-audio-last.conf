# USB outranks the laptop's own sound, and a dock's USB audio says it is available
# with nothing plugged in: last unless picked by hand.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_(output|input)\\..*Dock.*" } ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver = 100
      }
    }
  }
]
