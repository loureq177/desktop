<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Text drawn on the panel's red, green and blue stripes: what Chromium, Firefox and GTK read. -->
<fontconfig>
  <match target="pattern">
    <edit name="rgba" mode="append"><const>rgb</const></edit>
  </match>
</fontconfig>
