# Translucent, so Hyprland blurs what is behind it (decoration.blur). Read
# after the main config, so this wins over its opaque default.
background-opacity = 0.80
# Empty resets to Ghostty's default: the shared 15 is for macOS's points.
font-size =
# The desktop's colours, from ui.toml (apply-ui).
config-file = ?ui.conf
# No size box on each resize: tiling and fullscreen resize it all the time.
resize-overlay = never
