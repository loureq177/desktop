# Machine-local symlink (XDG_STATE_HOME), flipped by power-save. Never point
# this at a stowed file that power-save edits: ~/.config/ghostty is a stow
# link into the dotfiles repo, so in-place edits there land in git.
custom-shader = ~/.local/state/ghostty/active-shader.glsl
custom-shader-animation = true

copy-on-select = clipboard
# keybind = ctrl+v=paste_from_clipboard
# keybind = ctrl+a=select_all
