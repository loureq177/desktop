source = ~/.config/hypr/ui.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = $outline_thickness
    inner_color = rgba(22, 27, 34, 0.65)

    outer_color = $accent_blue $accent_purple 45deg
    check_color = $accent_green $accent_blue 120deg
    fail_color = $warning $critical 40deg

    font_color = $text_main
    fade_on_empty = false
    rounding = $rounding

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"<span font_weight='700'>%H:%M</span>"
    color = $text_main
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $text_main
    font_size = 18
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# Status baterii w prawym górnym rogu (odpowiednik pozycji w waybarze)
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/battery-status.sh
    color = $text_main
    font_size = 15
    font_family = $font
    position = -24, -14
    halign = right
    valign = top
}

