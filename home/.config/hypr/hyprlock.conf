# Auto-generated by apply-ui. DO NOT EDIT DIRECTLY.
# Modify ~/.config/ui/templates/hyprlock.conf or ~/.config/ui/ui.toml and run 'apply-ui'.

# The lock screen: clock, date and a password field over the blurred desktop.
# hypridle starts it; at login hyprland.lua does, with hyprlock-boot.conf.

general {
    hide_cursor = true
}

auth {
    # The empty field says when the reader is listening.
    fingerprint {
        enabled = true
        ready_message = Password or fingerprint
        present_message = Reading the fingerprint…
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeInOutSine, 0.37, 0, 0.63, 1
    animation = fadeIn, 1, 4.5, easeInOutSine
    animation = fadeOut, 1, 3, easeInOutSine
    animation = inputFieldDots, 1, 2, linear
}

# How the desktop is blurred; hyprlock-boot.conf blurs the wallpaper the same way.
$blur_size = 10
$blur_passes = 3
$blur_noise = 0.02
$blur_contrast = 1.0
$blur_brightness = 0.55
$blur_vibrancy = 0.2

background {
    monitor =
    path = screenshot
    color = rgb(0d1117)
    blur_size = $blur_size
    blur_passes = $blur_passes
    noise = $blur_noise
    contrast = $blur_contrast
    brightness = $blur_brightness
    vibrancy = $blur_vibrancy
    vibrancy_darkness = 0.0
    # Below the wallpaper of hyprlock-boot.conf.
    zindex = -2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(161b22a6)

    outer_color = rgba(58a6ffff) rgba(bc8cffff) 0deg
    check_color = rgba(3fb950ff) rgba(58a6ffff) 0deg
    fail_color = rgba(d29922ff) rgba(f85149ff) 0deg

    font_color = rgb(c9d1d9)
    fade_on_empty = false
    rounding = 8

    font_family = JetBrainsMono Nerd Font Propo
    placeholder_text = <span foreground="##8b949e">$FPRINTPROMPT</span>
    fail_text = $FAIL
    dots_spacing = 0.3

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_weight='700'>$TIME</span>
    color = rgb(c9d1d9)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(c9d1d9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 80
    halign = center
    valign = center
}
