# Auto-generated by apply-ui. DO NOT EDIT DIRECTLY.
# Modify ~/.config/ui/templates/hyprlock.conf or ~/.config/ui/ui.toml and run 'apply-ui'.

# The lock screen: clock, date and a password field over the blurred desktop.
# hypridle starts it; at login hyprland/autostart.lua does, with hyprlock-boot.conf.

general {
    hide_cursor = true
}

auth {
    # The label under the field says when the reader is listening.
    fingerprint {
        enabled = true
        ready_message = Password or fingerprint
        present_message = Reading the fingerprint…
    }
}

animations {
    bezier = linear, 1, 1, 0, 0
    bezier = easeInOutSine, 0.37, 0, 0.63, 1
    animation = fadeIn, 1, 4.5, easeInOutSine
    animation = fadeOut, 1, 3, easeInOutSine
    animation = inputFieldDots, 1, 2, linear
}

# How the desktop is blurred; hyprlock-boot.conf blurs the wallpaper the same way.
$blur_size = 10
$blur_passes = 3
$blur_noise = 0.02
$blur_contrast = 1.0
$blur_brightness = 0.55
$blur_vibrancy = 0.2

# The bar text's soft glow (Halo.qml) for text on the desktop; one pass, no boost.
$shadow_passes = 1
$shadow_size = 4
$shadow_boost = 1.0
$shadow_color = rgba(0, 0, 0, 0.4)

background {
    path = screenshot
    color = rgb(0d1117)
    blur_size = $blur_size
    blur_passes = $blur_passes
    noise = $blur_noise
    contrast = $blur_contrast
    brightness = $blur_brightness
    vibrancy = $blur_vibrancy
    # Below the wallpaper of hyprlock-boot.conf.
    zindex = -2
}

input-field {
    # Pixels, like the fonts and positions: a share of the screen grows the
    # field on a bigger monitor while the text around it stays put.
    size = 384, 54
    outline_thickness = 2
    inner_color = rgba(161b22a6)

    outer_color = rgba(58a6ffff) rgba(bc8cffff) 0deg
    check_color = rgba(3fb950ff) rgba(58a6ffff) 0deg
    fail_color = rgba(d29922ff) rgba(f85149ff) 0deg

    font_color = rgb(c9d1d9)
    fade_on_empty = false
    rounding = 8

    font_family = JetBrainsMono Nerd Font Propo
    placeholder_text =
    fail_text = $FAIL
    dots_spacing = 0.3

    position = 0, -50
}

# What the reader is doing; hyprlock-boot.conf has its own line in this spot.
label {
    text = $FPRINTPROMPT
    color = rgb(8b949e)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, -105
    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_boost = $shadow_boost
    shadow_color = $shadow_color
}

label {
    text = <span font_weight='700'>$TIME</span>
    color = rgb(c9d1d9)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 160
    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_boost = $shadow_boost
    shadow_color = $shadow_color
}

label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(c9d1d9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 80
    shadow_passes = $shadow_passes
    shadow_size = $shadow_size
    shadow_boost = $shadow_boost
    shadow_color = $shadow_color
}
