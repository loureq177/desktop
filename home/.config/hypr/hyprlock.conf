# Auto-generated by apply-ui. DO NOT EDIT DIRECTLY.
# Modify ~/.config/ui/templates/hyprlock.conf or ~/.config/ui/ui.toml and run 'apply-ui'.

# The stand-in lock screen. quickshell locks the session; lock-fallback
# runs hyprlock only when that shell cannot start, so that autologin never
# leaves an open desktop behind. Laid out like the quickshell lock screen:
# clock, date and a password field over the blurred desktop.

general {
    hide_cursor = true
}

auth {
    fingerprint {
        enabled = true
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 1.5, linear
    animation = fadeOut, 1, 1, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgb(0d1117)
    blur_size = 10
    blur_passes = 3
    noise = 0.02
    contrast = 1.0
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(161b22a6)

    outer_color = rgba(58a6ffee) rgba(bc8cffee) 45deg
    check_color = rgba(3fb950ee) rgba(58a6ffee) 120deg
    fail_color = rgba(d29922ee) rgba(f85149ee) 40deg

    font_color = rgb(c9d1d9)
    fade_on_empty = false
    rounding = 8

    font_family = JetBrainsMono Nerd Font Propo
    placeholder_text =
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"<span font_weight='700'>%H:%M</span>"
    color = rgb(c9d1d9)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(c9d1d9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = The shell did not start: after unlocking only the key binds work.
    color = rgb(8b949e)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 40
    halign = center
    valign = bottom
}
