general {
    lock_cmd = pidof hyprlock || hyprlock --immediate-render --no-fade-in
    before_sleep_cmd = loginctl lock-session
    # Delay DPMS-on after resume: the first key events after S3 are
    # swallowed by keyboard/xkb re-init (hyprlock "stray release event?",
    # upstream issue #499/#1020), so typing immediately always fails once.
    # Keeping the screen off briefly signals "not ready yet".
    after_sleep_cmd = sleep 5 && hyprctl eval 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl eval 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl eval 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 330
    on-timeout = systemctl suspend
}
