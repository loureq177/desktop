general {
    lock_cmd = pidof hyprlock || hyprlock --immediate-render --no-fade-in
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl eval 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl eval 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 330
    on-timeout = systemctl suspend
}
