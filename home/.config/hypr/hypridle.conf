general {
    lock_cmd = pidof hyprlock || hyprlock
    inhibit_sleep = 3
    before_sleep_cmd = hyprctl eval 'require("hyprland.monitors").note_sleep()'; loginctl lock-session
    after_sleep_cmd = sleep 0.2 && hyprctl eval 'local m = require("hyprland.monitors") m.wake() m.reconnect() m.refresh_panel()'; systemctl --user start check-updates.service
}

listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl eval 'require("hyprland.monitors").wake()'
}

# On AC it only locks and turns the screen off: a build or an agent keeps running.
listener {
    timeout = 330
    on-timeout = systemd-ac-power || systemctl suspend
}
