# In seconds; idle.conf, written by the shell's settings (SUPER + S), sets its own after.
$lock_after = 240
$screen_off_after = 300
$sleep_battery_after = 300
$sleep_ac_after = 600
source = ~/.config/hypr/idle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock
    inhibit_sleep = 3
    before_sleep_cmd = hyprctl eval 'require("hyprland.monitors").note_sleep()'; loginctl lock-session
    after_sleep_cmd = sleep 0.2 && hyprctl eval 'local m = require("hyprland.monitors") m.wake() m.reconnect() m.refresh_panel()'; systemctl --user start check-updates.service
}

listener {
    timeout = $lock_after
    on-timeout = loginctl lock-session
}

listener {
    timeout = $screen_off_after
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl eval 'require("hyprland.monitors").wake()'
}

# Sleep sooner on battery; keep awake holds both off.
listener {
    timeout = $sleep_battery_after
    on-timeout = systemd-ac-power || systemctl suspend
}

listener {
    timeout = $sleep_ac_after
    on-timeout = systemctl suspend
}
