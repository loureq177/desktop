# What `apply-apps --pick` offers: the browser, and a special workspace per category
# with one app of its list (the first is the default). Each special opens with
# SUPER + SHIFT + its key, which every special must have.
#
# An app is a web app (`url`), a terminal program (`term`) or a program of its own
# (`exec`, with the window `class` it opens). `icon` is the bar's (LineIcons.js,
# the category's when left out), `app_icon` the launcher's (icons/ or a theme icon),
# `desktop` the desktop entry the launcher lists as the special instead, `title`
# what the web app's window title has in it (its name when left out), `player` the
# MPRIS player it plays through. `pacman`, `aur` and `flatpak` are what it needs.

# Taken by other SUPER + SHIFT binds (binds.lua).
reserved = ["H", "J", "K", "L"]

# `engine`: how its web apps run, as windows of a Firefox profile of their own or as
# Chromium --app windows.
browsers = [
	{ id = "firefox", name = "Firefox", exec = "firefox", desktop = "firefox.desktop", engine = "firefox", pacman = ["firefox"] },
	{ id = "chromium", name = "Chromium", exec = "chromium", desktop = "chromium.desktop", engine = "chromium", pacman = ["chromium"] },
	{ id = "brave", name = "Brave", exec = "brave", desktop = "brave-browser.desktop", engine = "chromium", aur = ["brave-bin"] },
	{ id = "chrome", name = "Google Chrome", exec = "google-chrome-stable", desktop = "google-chrome.desktop", engine = "chromium", aur = ["google-chrome"] },
	{ id = "zen", name = "Zen Browser", exec = "zen-browser", desktop = "zen.desktop", engine = "firefox", aur = ["zen-browser-bin"] },
]

# `standard`: in the set the installer offers as a whole; `background`: started
# hidden with the session, so its notifications come before it is first opened;
# `bar = false` keeps it off the bar's row of specials.

[[category]]
id = "calendar"
title = "Calendar"
key = "C"
icon = "calendar"
standard = true
background = true
apps = [
	{ name = "Google Calendar", url = "https://calendar.google.com", title = "Calendar", icon = "googlecalendar", app_icon = "icons/google-calendar.svg" },
	{ name = "Outlook Calendar", url = "https://outlook.live.com/calendar", title = "Outlook", app_icon = "outlook-for-linux" },
	{ name = "Proton Calendar", url = "https://calendar.proton.me", title = "Proton Calendar", app_icon = "org.gnome.Calendar" },
]

