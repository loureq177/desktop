$font = JetBrainsMono Nerd Font Propo

# GitHub Dark Palette
$accent_blue = rgba(58a6ffee)
$accent_purple = rgba(bc8cffee)
$accent_green = rgba(3fb950ee)
$warning = rgba(d29922ee)
$critical = rgba(f85149ee)
$text_main = rgb(201, 209, 217)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = $accent_blue $accent_purple 45deg
    check_color = $accent_green $accent_blue 120deg
    fail_color = $warning $critical 40deg

    font_color = $text_main
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='800'>$(date +'%H:%M')</span>"
    font_size = 80
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"<span font_weight='700'>%A, %d %B %Y</span>"
    font_size = 22
    font_family = $font
    position = 0, 50
    halign = center
    valign = center
}
